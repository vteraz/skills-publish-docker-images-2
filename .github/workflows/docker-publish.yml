name: Docker Publish
on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        name: Login in to the Container Registry
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Publish Docker Image
        run: | 
          docker build . -t ghcr.io/vteraz/skills-publish-docker-images-2/stackoverflown:main
          docker push ghcr.io/vteraz/skills-publish-docker-images-2/stackoverflown:main